<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>

    <style>

        /* Full page background */
        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image: url("https://static0.anpoimages.com/wordpress/wp-content/uploads/2024/05/wuthering-waves-hero-resized-16-9.jpg?w=1200&h=675&fit=crop");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
        }


        /* Main heading */
        h1 {
            text-align: center;

            font-size: 45px;

            margin: 30px 0;

            text-shadow: 2px 2px 8px black;
        }


        /* Table */
        table {
            width: 90%;

            margin: auto;

            border-collapse: collapse;

            background-color: rgba(0, 0, 0, 0.65);

            box-shadow: 0 0 20px black;
        }


        /* Table headings */
        th {
            background-color: rgba(180, 0, 0, 0.9);

            color: white;

            padding: 15px;

            font-size: 18px;

            border: 2px solid white;
        }


        /* Table data */
        td {
            padding: 15px;

            text-align: center;

            font-size: 17px;

            border: 2px solid white;
        }


        /* Images */
        td img {
            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 8px;

            display: block;

            margin: auto;
        }


        /* Hover effect */
        tbody tr:hover {
            background-color: rgba(255, 0, 0, 0.25);
        }

    </style>

</head>


<body>

    <h1>Pull Suggestions Wuwa</h1>


    <table>

        <thead>

            <tr>

                <th>
                    Photo
                </th>

                <th>
                    Name
                </th>

                <th>
                    Release version
                </th>

                <th>
                    Tier/Pull value
                </th>

            </tr>

        </thead>


        <tbody>

            <tr>

                <td>
                   <a href="https://www.prydwen.gg/wuthering-waves/characters/changli" target="_blank"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlET8pvX0qm4c4RDUFK48WVeICTeMJysSmQMVLUEyZmDAgshsgXF1pBVlw&s=10"
                        alt="Changli"></a>
                </td>

                <td>
                    Changli
                </td>

                <td>
                    1.2
                </td>

                <td>
                    T3/Don't pull
                </td>

            </tr>


            <tr>

                <td>
                    <a href="https://www.prydwen.gg/wuthering-waves/characters/hiyuki" target="_blank"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJPMamoJ1SfoS4D2AYRDVRrU1ra0QhiDvjf5KMU0FAGMdYDQjigUXQHHk&s=10"
                        alt="Hiyuki"></a>
                </td>

                <td>
                    Hiyuki
                </td>

                <td>
                    3.4
                </td>

                <td>
                    T0/Must pull
                </td>

            </tr>


            <tr>

                <td>
                   <a href="https://www.prydwen.gg/wuthering-waves/characters/lynae" target="_blank"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1w2f6Pdk6qNi-JbazxUZn8od02Fgtmbu2WhfjS6dGs4iAH5esB1MXwUt-&s=10"
                        alt="Lynae"></a>
                </td>

                <td>
                    Lynae
                </td>

                <td>
                    3.0
                </td>

                <td>
                    T0/Must pull
                </td>

            </tr>

        </tbody>

    </table>


</body>

</html>
